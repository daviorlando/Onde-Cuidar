name: Dados e links

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  data-checks:
    name: data-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check local Markdown links
        run: python3 scripts/check_docs.py
      - name: Validate catalog and road package
        run: python3 scripts/data/validate_data.py
